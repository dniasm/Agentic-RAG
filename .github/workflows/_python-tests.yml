# Reusable: Python setup once (plus tesseract / Node when a suite needs them); callers pass only the test paths.
name: Python tests (reusable)

on:
  workflow_call:
    inputs:
      name:
        description: Job name shown in the Actions UI
        type: string
        default: pytest
      tests:
        description: Space-separated test paths/globs (shell-expanded)
        type: string
        required: true
      tesseract:
        description: Install tesseract (OCR tests read scanned pages with it)
        type: boolean
        default: false
      node:
        description: Install Node and the frontend packages (tests that import frontend/src)
        type: boolean
        default: false

jobs:
  pytest:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - if: inputs.tesseract
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - if: inputs.node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: inputs.node
        run: npm ci
        working-directory: frontend
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -rs -p no:cacheprovider ${{ inputs.tests }}
