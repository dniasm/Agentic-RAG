name: "Services · gRPC"
run-name: "Services · gRPC · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  service:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Service bootstrap tests"
            tests: backend/tests/services/test_services_server.py backend/tests/services/test_services_tooling.py
          - name: "user"
            tests: backend/tests/services/test_user_service.py backend/tests/services/test_user_chat_limits.py
          - name: "conversation"
            tests: backend/tests/services/test_conversation_service.py
          - name: "memory"
            tests: backend/tests/services/test_memory_service.py
          - name: "document"
            tests: backend/tests/services/test_document_service.py backend/tests/services/test_document_catalog.py
    uses: ./.github/workflows/_python-tests.yml
    with:
      name: ${{ matrix.name }}
      tests: ${{ matrix.tests }}

  generated-code:
    name: Generated protobuf code is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/gen_protos.py --check
