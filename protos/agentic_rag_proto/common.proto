syntax = "proto3";

// Shared messages for the orchestrator <-> service calls. The service protos (user, conversation, memory,
// document) arrive in later phases and import this file.
package agentic_rag.v1;

// Cursor paging for list calls: empty cursor = first page; the reply's next_cursor is empty on the last page.
message PageRequest {
  int32 limit = 1;
  string cursor = 2;
}

message PageInfo {
  string next_cursor = 1;
}
